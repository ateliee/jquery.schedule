name: Bump Version

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'New version (e.g., 1.2.3)'
        required: true
        default: '1.0.0'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Update package version
        id: update_version
        run: |
          NEW_VERSION=${{ inputs.new_version }}
          # Use npm version without creating a git tag
          npm version $NEW_VERSION --no-git-tag-version
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="bump-version/${{ inputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add package.json
          git commit -m "chore: bump version to ${{ inputs.new_version }}"
          git push origin "$BRANCH_NAME"
          gh pr create --title "chore: bump version to ${{ inputs.new_version }}" \
                       --body "Bumping package version to \`${{ inputs.new_version }}\` via workflow dispatch." \
                       --head "$BRANCH_NAME" \
                       --base "${{ github.ref_name }}"
